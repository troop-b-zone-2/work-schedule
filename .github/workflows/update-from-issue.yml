name: Update schedule from Issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.event.issue.state == 'open'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse issue and update schedule.csv
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/parse_issue_and_update.py

      - name: Generate calendar.ics
        run: python scripts/generate_ics.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.csv public/calendar.ics
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update schedule from issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Comment and close issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Schedule updated and calendar regenerated.'
            })
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })
