name: Generate ICS

on:
  push:
    paths:
      - 'data/schedule.csv'
      - 'scripts/generate_ics.py'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate calendar.ics
        run: python scripts/generate_ics.py

      - name: Commit updated ICS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/calendar.ics
          if git diff --staged --quiet; then
            echo "No changes to calendar.ics"
          else
            git commit -m "Update calendar.ics from schedule.csv"
            git push
          fi
